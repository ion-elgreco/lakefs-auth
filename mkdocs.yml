site_name: lakefs-auth
site_description: Authentication and authorization servers for open-source lakeFS
site_url: https://ion-elgreco.github.io/lakefs-auth/
repo_url: https://github.com/ion-elgreco/lakefs-auth
repo_name: lakefs-auth

extra:
  version:
    provider: mike

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.expand
    - navigation.indexes
    - search.highlight
    - search.share
    - toc.follow
    - navigation.top

nav:
  - Home: index.md
  - Installation:
      - installation/index.md
      - Secrets: installation/secrets.md
      - Docker: installation/docker.md
      - Helm: installation/helm.md
      - Bootstrap file: installation/bootstrap.md
      - Container images: installation/images.md
  - Operations: operations.md
  - Tools:
      - Policy builder: tools/policy-builder.md
  - Authentication flows: authn-flows.md
  - Reference:
      - lakefs-authn: reference/lakefs-authn.md
      - lakefs-authz: reference/lakefs-authz.md

markdown_extensions:
  - admonition
  - pymdownx.details
  # Mermaid diagrams: the fence is rendered by the theme's bundled Mermaid loader.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  # The reference pages include the crate READMEs from the repository root.
  - pymdownx.snippets:
      check_paths: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
