suite: secrets
templates:
  - templates/secrets.yaml
  - templates/authz-deployment.yaml
  - templates/authn-deployment.yaml
release:
  name: lakefs-auth
  namespace: lakefs
tests:
  - it: creates the Secrets from inline values and points the pods at them
    values:
      - ./values/base.yaml
    set:
      authn.oidc.clientSecret.value: hunter2
    asserts:
      - template: templates/secrets.yaml
        hasDocuments:
          count: 3
      - template: templates/secrets.yaml
        documentIndex: 0
        equal:
          path: metadata.name
          value: lakefs-auth-shared-secret
      - template: templates/secrets.yaml
        documentIndex: 0
        equal:
          path: stringData.auth_encrypt_secret_key
          value: test-shared-secret
      - template: templates/secrets.yaml
        documentIndex: 1
        equal:
          path: metadata.name
          value: lakefs-authz-database
      - template: templates/secrets.yaml
        documentIndex: 2
        equal:
          path: metadata.name
          value: lakefs-authn-oidc
      - template: templates/authz-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAKEFS_AUTHZ_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: lakefs-auth-shared-secret
                key: auth_encrypt_secret_key
      - template: templates/authn-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAKEFS_AUTHN_OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: lakefs-authn-oidc
                key: client-secret

  - it: uses existing Secrets and creates none
    set:
      sharedSecret.existingSecret: lakefs-secrets
      authz.database.existingSecret: lakefs-authz-db
      authz.encryptionKey.existingSecret: lakefs-authz-keys
      authn.publicUrl: https://lakefs.example.com
      authn.oidc.issuer: https://idp.example.com/realms/lakefs
      authn.oidc.clientId: lakefs
      authn.oidc.clientSecret.existingSecret: lakefs-oidc
    asserts:
      - template: templates/secrets.yaml
        hasDocuments:
          count: 0
      - template: templates/authz-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAKEFS_AUTHZ_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: lakefs-authz-db
                key: database-url
      - template: templates/authz-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAKEFS_AUTHZ_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: lakefs-authz-keys
                key: encryption-key
      - template: templates/authn-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAKEFS_AUTHN_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: lakefs-secrets
                key: auth_encrypt_secret_key

  - it: omits the client secret for a public client
    values:
      - ./values/base.yaml
    asserts:
      - template: templates/authn-deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAKEFS_AUTHN_OIDC_CLIENT_SECRET
          any: true

  - it: fails without a shared secret
    set:
      authz.database.url: postgres://authz:authz@postgres:5432/authz
    asserts:
      - template: templates/authz-deployment.yaml
        failedTemplate:
          errorPattern: sharedSecret.existingSecret

  - it: fails without a database
    set:
      sharedSecret.value: s
    asserts:
      - template: templates/authz-deployment.yaml
        failedTemplate:
          errorPattern: authz.database.existingSecret
