suite: image defaults
templates:
  - templates/authz-deployment.yaml
  - templates/authn-deployment.yaml
values:
  - ./values/base.yaml
release:
  name: lakefs-auth
  namespace: lakefs
chart:
  appVersion: "0.0.0-dev"
tests:
  - it: empty image falls back to the ghcr.io ref at Chart.AppVersion
    asserts:
      - template: templates/authz-deployment.yaml
        equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/ion-elgreco/lakefs-authz:0.0.0-dev
      - template: templates/authn-deployment.yaml
        equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/ion-elgreco/lakefs-authn:0.0.0-dev

  - it: explicit image overrides the ghcr default
    set:
      authz.image: lakefs-authz:dev
      authn.image: lakefs-authn:dev
    asserts:
      - template: templates/authz-deployment.yaml
        equal:
          path: spec.template.spec.containers[0].image
          value: lakefs-authz:dev
      - template: templates/authn-deployment.yaml
        equal:
          path: spec.template.spec.containers[0].image
          value: lakefs-authn:dev
