{{- if and .Values.authn.enabled .Values.authn.httpRoute.enabled }}
{{- if not .Values.authn.httpRoute.parentRefs }}
{{ fail "authn.httpRoute.parentRefs is required when authn.httpRoute.enabled is true: the Gateway to attach the route to" }}
{{- end }}
{{- $svcPort := .Values.authn.port }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lakefs-authn
  labels:
    app.kubernetes.io/name: lakefs-authn
    {{- include "lakefs-auth.labels" . | nindent 4 }}
  {{- with .Values.authn.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.authn.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.authn.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.authn.httpRoute.rules }}
    {{- with .matches }}
    - matches:
      {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .filters }}
      filters:
      {{- toYaml . | nindent 8 }}
    {{- end }}
      backendRefs:
        - name: lakefs-authn
          port: {{ $svcPort }}
          weight: 1
    {{- end }}
{{- end }}
