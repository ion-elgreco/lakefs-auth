[package]
name = "lakefs-auth-core"
description = "Shared models, validation, JWT and crypto helpers for the lakeFS auth servers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
server = ["dep:axum", "dep:tower", "dep:tower-http", "dep:tracing-subscriber", "dep:tokio", "dep:http", "dep:prometheus", "dep:humantime"]
jwt = ["dep:jsonwebtoken", "dep:uuid"]
crypto = ["dep:aes-gcm", "dep:hkdf", "dep:sha2", "dep:rand", "dep:zeroize"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
jiff = { workspace = true }
tracing = { workspace = true }
subtle = { workspace = true }
percent-encoding = { workspace = true }
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
http = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
humantime = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
serde_urlencoded = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
